<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="dashboards" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="visual" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#000" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <circle cx="200" cy="120" r="110" fill="#6366f1" opacity="0.25" filter="url(#blur)"/>
  <circle cx="1000" cy="280" r="130" fill="#fb923c" opacity="0.20" filter="url(#blur)"/>

  <g transform="translate(80,80)">
    <rect width="80" height="80" rx="20" fill="url(#logo)"/>
    <rect x="18" y="22" width="36" height="36" rx="6" fill="white" opacity="0.5"/>
    <rect x="28" y="32" width="36" height="36" rx="6" fill="white"/>
    <circle cx="58" cy="26" r="4.5" fill="#fb923c"/>
  </g>

  <text x="200" y="130" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#0a0a0a">shipit-ui-design</text>
  <text x="200" y="165" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#525252">Senior UI/UX in your terminal.</text>

  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#0a0a0a">Polished UI. </text>
  <text x="450" y="270" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#dashboards)">Dashboards</text>
  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#visual)">Visual</text>
  <text x="270" y="340" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#0a0a0a"> feedback loop.</text>

  <g transform="translate(900,80)">
    <rect width="60" height="60" rx="14" fill="#e0e7ff"/>
    <rect x="70"  width="60" height="60" rx="14" fill="#a5b4fc"/>
    <rect x="140" width="60" height="60" rx="14" fill="#6366f1"/>
    <rect y="70"  width="60" height="60" rx="14" fill="#4338ca"/>
    <rect x="70"  y="70"  width="60" height="60" rx="14" fill="#3730a3"/>
    <rect x="140" y="70"  width="60" height="60" rx="14" fill="#312e81"/>
  </g>
</svg>
